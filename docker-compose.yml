services:
  api:
    build:
      context: .
      target: runtime
    image: momentum-planner-api:latest
    container_name: momentum-planner-api
    ports:
      # 宿主机端口通过环境变量 HOST_PORT 配置，默认 8080；容器内固定 8000。
      - "${HOST_PORT:-8080}:8000"
    environment:
      UVICORN_LOG_LEVEL: "${LOG_LEVEL:-info}"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  verify:
    build:
      context: .
      target: verify
    image: momentum-planner-verify:latest
    container_name: momentum-planner-verify
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: "http://api:8000"
    restart: "no"
